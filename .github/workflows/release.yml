name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Leave empty for automatic minor/patch or recovery; exact next major only (for example 1.0.0)'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'push' ||
        !(github.actor == 'github-actions[bot]' &&
          startsWith(github.event.head_commit.message, 'chore(release): ')))
    runs-on: ubuntu-latest
    steps:
      # Resolve main after waiting for concurrency, not the queued event SHA.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test release tooling offline
        run: node --test tools/plan-release.test.js tools/release.test.js

      - name: Validate repository versions and changelog
        run: node tools/plan-release.js --check

      - name: Install dependencies and run renderer unit tests
        working-directory: skills/diagram-renderer
        run: |
          npm install
          npm test

      - name: Plan, validate cut, atomically push and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          release_auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$release_auth_header"
          git config --local "http.https://github.com/${GITHUB_REPOSITORY}.extraheader" \
            "AUTHORIZATION: basic $release_auth_header"
          node tools/release.js
